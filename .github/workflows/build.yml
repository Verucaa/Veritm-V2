name: Build APKs

on:
  workflow_dispatch:
  push:
    # Feature branches are covered by "Build PR". Building them here too added
    # four more APK builds on top of it for every push. Use workflow_dispatch
    # when a branch needs veritm artifacts.
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: write
  discussions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release:
    name: Build Release (${{ matrix.variant }})
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        include:
          # FOSS and Izzy differ from GMS only by ~80 lines of Cast stubs,
          # plus the updater flag for Izzy (GMS and FOSS enable the updater,
          # Izzy disables it). Both are still built by the release workflow,
          # so building them veritm too doubled this workflow for almost no
          # extra coverage.
          - variant: gms
            variantName: Gms

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew --console=plain assemble${{ matrix.variantName }}Release --warning-mode summary
        env:
          VERITM_APPLICATION_ID: com.veritm.music
          VERITM_APP_NAME: Veritm
          VERITM_BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Move signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "$OUTPUT_DIR/out"
          if [ "${{ matrix.variant }}" = "gms" ]; then
            TARGET_NAME="app-universal-with-Google-Cast.apk"
          else
            TARGET_NAME="app-universal-release.apk"
          fi
          find "$OUTPUT_DIR" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" | xargs -I{} mv {} "$OUTPUT_DIR/out/$TARGET_NAME"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant == 'gms' && 'app-with-Google-Cast' || 'app-release' }}
          path: app/build/outputs/apk/${{ matrix.variant }}/release/out/*

  build_debug:
    name: Build Debug (${{ matrix.variant }})
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        include:
          # FOSS and Izzy differ from GMS only by ~80 lines of Cast stubs,
          # plus the updater flag for Izzy (GMS and FOSS enable the updater,
          # Izzy disables it). Both are still built by the release workflow,
          # so building them veritm too doubled this workflow for almost no
          # extra coverage.
          - variant: gms
            variantName: Gms

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Generate a fresh debug keystore on the runner. This must match the
      # `signingConfigs.debug` block in app/build.gradle.kts (alias, store
      # password, key password). Using keytool here is more robust than
      # restoring a base64 secret, which silently produces an empty (0-byte)
      # keystore when the secret is not set, and later fails at
      # :app:packageGmsDebug with:
      #   KeytoolException: Tag number over 30 is not supported
      - name: Generate Debug Keystore
        run: |
          rm -f ./app/persistent-debug.keystore
          keytool -genkeypair -v \
            -keystore ./app/persistent-debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -l ./app/persistent-debug.keystore

      # Lint is intentionally not run in CI: it never gated a merge and added
      # several minutes to every build. Run :app:lintGmsRelease locally.
      - name: Build Debug APK
        run: ./gradlew --console=plain assemble${{ matrix.variantName }}Debug --warning-mode summary
        env:
          VERITM_APPLICATION_ID: com.veritm.music
          VERITM_APP_NAME: VERITM Nightly
          VERITM_BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant == 'gms' && 'app-debug-gms' || 'app-debug' }}
          path: app/build/outputs/apk/${{ matrix.variant }}/debug/*.apk

  publish_veritm:
    name: Publish VERITM Release
    if: github.event_name == 'push'
    needs: [build_release, build_debug]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download Signed APK
        uses: actions/download-artifact@v8
        with:
          name: app-with-Google-Cast
          path: veritm

      - name: Publish VERITM Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv veritm/app-universal-with-Google-Cast.apk veritm/VERITM-release.apk

          PREVIOUS_VERITM_SHA=$(gh release view veritm --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          {
            echo "Automated prerelease built from main at commit $GITHUB_SHA. It may be unstable."
            if [ -n "$PREVIOUS_VERITM_SHA" ] && [ "$PREVIOUS_VERITM_SHA" != "$GITHUB_SHA" ]; then
              echo
              echo "## Changes since previous release"
              gh api "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS_VERITM_SHA...$GITHUB_SHA" \
                --jq '.commits[] | "* \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"'
            fi
          } > veritm-notes.md

          if gh release view veritm > /dev/null 2>&1; then
            gh release delete veritm --yes --cleanup-tag
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/veritm" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/veritm"
          fi

          gh release create veritm \
            veritm/VERITM-release.apk \
            --target "$GITHUB_SHA" \
            --title "VERITM Release" \
            --notes-file veritm-notes.md \
            --generate-notes \
            --prerelease \
            --latest=false
